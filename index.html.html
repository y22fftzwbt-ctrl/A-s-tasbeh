<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A & S | مسبحتنا</title>
  <style>
    :root {
      --bg: #f2f6f3;
      --card: #ffffff;
      --surface: #f8fbf9;
      --primary: #1b6b4b;
      --primary-grad: linear-gradient(145deg, #22825b, #15563b);
      --primary-light: #e5f1eb;
      --text: #15241d;
      --muted: #5a7065;
      --border: #dce6e0;
      --shadow: rgba(21, 36, 29, 0.08);
      --danger: #b53838;
      --danger-bg: #fdf6f6;
      --danger-border: #edd4d4;
    }

    body.dark {
      --bg: #0e1512;
      --card: #16201c;
      --surface: #1d2a25;
      --primary: #34a878;
      --primary-grad: linear-gradient(145deg, #2d966b, #1c6b4b);
      --primary-light: #1e352b;
      --text: #ecf3ef;
      --muted: #93aba0;
      --border: #273831;
      --shadow: rgba(0, 0, 0, 0.35);
      --danger: #e06c6c;
      --danger-bg: #291b1b;
      --danger-border: #422727;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      transition: background 0.25s ease, color 0.25s ease;
      touch-action: manipulation;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 28px;
      padding: 22px 20px 26px;
      text-align: center;
      box-shadow: 0 14px 36px var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .dedication {
      background: var(--primary-light);
      color: var(--primary);
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(27, 107, 75, 0.14);
    }

    .monogram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: var(--card);
      color: var(--primary);
      padding: 4px 16px;
      border-radius: 999px;
      margin-bottom: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      direction: ltr;
    }

    .dedication-text {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 7px 11px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .total-pill {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .total-pill strong {
      color: var(--text);
    }

    .selectors {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 14px;
    }

    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    .target-input-wrap {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 10px;
      width: 118px;
    }

    .target-input-wrap span {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .target-input-wrap input {
      border: none;
      background: transparent;
      padding: 10px 4px;
      text-align: center;
      font-weight: 700;
    }

    .dhikr-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 14px;
      margin-bottom: 20px;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .dhikr-text {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .dhikr-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .tap-btn {
      width: 196px;
      height: 196px;
      border-radius: 50%;
      border: none;
      background: var(--primary-grad);
      color: #ffffff;
      font-size: 3.3rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(27, 107, 75, 0.28), inset 0 2px 4px rgba(255, 255, 255, 0.2);
      transition: transform 0.07s ease, box-shadow 0.12s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tap-btn:active {
      transform: scale(0.94);
    }

    .tap-sub {
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0.88;
      margin-top: 2px;
    }

    .progress-wrap {
      margin: 20px 0 16px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--primary-light);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .progress-label {
      margin-top: 7px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .btn-sec {
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-reset {
      color: var(--danger);
      border-color: var(--danger-border);
      background: var(--danger-bg);
    }

    .add-panel {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: right;
    }

    .add-panel.open {
      display: block;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .footer-sign {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .celebrate-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99;
      backdrop-filter: blur(3px);
    }

    .celebrate-modal.show {
      display: flex;
    }

    .celebrate-card {
      width: 100%;
      max-width: 350px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      animation: popIn 0.22s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .celebrate-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .celebrate-msg {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.55;
      margin-bottom: 8px;
      color: var(--text);
    }

    .celebrate-sub {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .celebrate-actions {
      display: flex;
      gap: 8px;
    }

    .celebrate-btn {
      flex: 1;
      padding: 11px 12px;
      border-radius: 13px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .celebrate-btn.sec {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="dedication">
      <div class="monogram">A &amp; S</div>
      <div class="dedication-text">«نُسبِّحُ معاً.. ليقتربَ قلبانا إلى الله»</div>
    </div>

    <div class="top-bar">
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي">🌙 ليلي</button>
        <button class="icon-btn" id="muteBtn" title="الصوت">🔊 الصوت</button>
      </div>
      <div class="total-pill">المجموع: <strong id="totalCount">0</strong></div>
    </div>

    <div class="selectors">
      <select id="dhikrSelect" aria-label="اختر الذكر"></select>
      <div class="target-input-wrap" title="العدد المستهدف لهذا الذكر">
        <span>الهدف:</span>
        <input type="number" id="targetInput" min="0" max="99999" value="33" />
      </div>
    </div>

    <div class="dhikr-box">
      <div class="dhikr-text" id="dhikrText">سبحان الله</div>
      <div class="dhikr-note" id="dhikrNote"></div>
    </div>

    <button class="tap-btn" id="countBtn" aria-label="اضغط للتسبيح">
      <span id="currentCount">0</span>
      <span class="tap-sub">اضغط للتسبيح</span>
    </button>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">0 من 33</div>
    </div>

    <div class="controls">
      <button class="btn-sec" id="nextBtn">الذكر التالي ⏭</button>
      <button class="btn-sec" id="toggleAddBtn">➕ إضافة ذكر</button>
      <button class="btn-sec btn-reset" id="resetBtn" style="grid-column: span 2;">تصفير عداد الذكر الحالي</button>
    </div>

    <div class="add-panel" id="addPanel">
      <div class="add-row">
        <input type="text" id="newDhikrText" placeholder="اكتب الذكر هنا..." />
        <input type="number" id="newDhikrTarget" placeholder="العدد" value="100" min="0" />
      </div>
      <button class="btn-save" id="saveDhikrBtn">حفظ الذكر وبدء العدّ</button>
    </div>

    <div class="footer-sign">صُنع بحبٍّ وطاعة • A &amp; S</div>
  </div>

  <div class="celebrate-modal" id="celebrateModal" role="dialog" aria-modal="true">
    <div class="celebrate-card">
      <div class="celebrate-tag" id="celebrateTag">أتممت الهدف ✨</div>
      <div class="celebrate-msg" id="celebrateMsg">راهو قلبي الشطور ❤️ استمرّ</div>
      <div class="celebrate-sub" id="celebrateSub">اللهم اجمعنا على طاعتك ورضاك</div>
      <div class="celebrate-actions">
        <button class="celebrate-btn sec" id="stayBtn">إكمال العدّ</button>
        <button class="celebrate-btn" id="goNextBtn">الذكر التالي ⏭</button>
      </div>
    </div>
  </div>

  <script>
    const defaultAdhkar = [
      { text: "سبحان الله", target: 33, note: "تسبيح دبر الصلاة (33)" },
      { text: "الحمد لله", target: 33, note: "تحميد دبر الصلاة (33)" },
      { text: "الله أكبر", target: 34, note: "تكبير دبر الصلاة (34)" },
      { text: "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير", target: 100, note: "تمام المائة أو 100 مرة يومياً" },
      { text: "أستغفر الله وأتوب إليه", target: 100, note: "سنة النبي ﷺ في اليوم (100)" },
      { text: "سبحان الله وبحمده", target: 100, note: "حُطّت خطاياه وإن كانت مثل زبد البحر (100)" },
      { text: "سبحان الله وبحمده، سبحان الله العظيم", target: 100, note: "كلمتان خفيفتان على اللسان ثقيلتان في الميزان" },
      { text: "اللهم صلِّ وسلم على نبينا محمد", target: 100, note: "الصلاة على النبي ﷺ (10 أو 100)" },
      { text: "لا حول ولا قوة إلا بالله", target: 100, note: "كنز من كنوز الجنة" },
      { text: "حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم", target: 7, note: "صباحاً ومساءً (7 مرات)" },
      { text: "رضيت بالله رباً وبالإسلام ديناً وبمحمد ﷺ نبياً", target: 3, note: "صباحاً ومساءً (3 مرات)" },
      { text: "بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم", target: 3, note: "صباحاً ومساءً (3 مرات)" },
      { text: "سبحان الله عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته", target: 3, note: "أذكار الصباح (3 مرات)" },
      { text: "لا إله إلا أنت سبحانك إني كنت من الظالمين", target: 100, note: "دعاء ذي النون" }
    ];

    // رسائل بصيغة مباشرة منك إليها عند اكتمال العدد فقط
    const completionMessages = [
      {
        msg: "راهو قلبي الشطور ❤️ استمرّ",
        sub: "اللهم اجمعنا على طاعتك ورضاك"
      },
      {
        msg: "أحبك في الله ❤️",
        sub: "اللهم اجعل محبتنا عوناً لنا على طاعتك"
      },
      {
        msg: "أنا فخور بيك ✨",
        sub: "تقبّل الله منك وجعلها في ميزان حسناتك"
      },
      {
        msg: "اللهم اجمعنا على طاعتك ورضاك",
        sub: "واكتب لنا السعادة والسكينة في الدنيا والآخرة"
      },
      {
        msg: "اللهم بارك لنا في أوقاتنا وقلوبنا",
        sub: "وقرّبنا إليك ذكراً وشكراً وطاعة"
      }
    ];

    let adhkar = JSON.parse(localStorage.getItem("our_adhkar_list") || "null") || defaultAdhkar;
    let index = Number(localStorage.getItem("our_adhkar_idx") || 0);
    if (index >= adhkar.length) index = 0;

    let counts = JSON.parse(localStorage.getItem("our_adhkar_counts") || "{}");
    let isMuted = localStorage.getItem("our_adhkar_muted") === "true";
    let isDark = localStorage.getItem("our_adhkar_dark") === "true";
    let doneIdx = 0;

    const dhikrSelect = document.getElementById("dhikrSelect");
    const targetInput = document.getElementById("targetInput");
    const dhikrText = document.getElementById("dhikrText");
    const dhikrNote = document.getElementById("dhikrNote");
    const currentCountEl = document.getElementById("currentCount");
    const totalCountEl = document.getElementById("totalCount");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");
    const countBtn = document.getElementById("countBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const themeBtn = document.getElementById("themeBtn");
    const muteBtn = document.getElementById("muteBtn");
    const toggleAddBtn = document.getElementById("toggleAddBtn");
    const addPanel = document.getElementById("addPanel");
    const newDhikrText = document.getElementById("newDhikrText");
    const newDhikrTarget = document.getElementById("newDhikrTarget");
    const saveDhikrBtn = document.getElementById("saveDhikrBtn");

    const celebrateModal = document.getElementById("celebrateModal");
    const celebrateTag = document.getElementById("celebrateTag");
    const celebrateMsg = document.getElementById("celebrateMsg");
    const celebrateSub = document.getElementById("celebrateSub");
    const stayBtn = document.getElementById("stayBtn");
    const goNextBtn = document.getElementById("goNextBtn");

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playClickSound() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(620, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.035);

      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.035);
    }

    function playGoalSound() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const notes = [523.25, 659.25, 783.99];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        const start = ctx.currentTime + i * 0.09;
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.22, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    }

    function openCelebration(target) {
      const item = completionMessages[doneIdx % completionMessages.length];
      doneIdx++;
      celebrateTag.textContent = target > 0 ? `أتممت ${target} من الذكر ✨` : "أتممت الذكر ✨";
      celebrateMsg.textContent = item.msg;
      celebrateSub.textContent = item.sub;
      celebrateModal.classList.add("show");
    }

    stayBtn.addEventListener("click", () => {
      celebrateModal.classList.remove("show");
    });

    goNextBtn.addEventListener("click", () => {
      celebrateModal.classList.remove("show");
      index = (index + 1) % adhkar.length;
      saveAll();
      renderSelect();
      updateUI();
    });

    function saveAll() {
      localStorage.setItem("our_adhkar_list", JSON.stringify(adhkar));
      localStorage.setItem("our_adhkar_idx", index);
      localStorage.setItem("our_adhkar_counts", JSON.stringify(counts));
      localStorage.setItem("our_adhkar_muted", isMuted);
      localStorage.setItem("our_adhkar_dark", isDark);
    }

    function renderSelect() {
      dhikrSelect.innerHTML = "";
      adhkar.forEach((item, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        const shortText = item.text.length > 34 ? item.text.slice(0, 34) + "..." : item.text;
        opt.textContent = `${shortText} (${item.target || "مفتوح"})`;
        if (idx === index) opt.selected = true;
        dhikrSelect.appendChild(opt);
      });
    }

    function updateThemeAndMuteUI() {
      document.body.classList.toggle("dark", isDark);
      themeBtn.textContent = isDark ? "☀️ نهاري" : "🌙 ليلي";
      muteBtn.textContent = isMuted ? "🔇 صامت" : "🔊 الصوت";
    }

    function updateUI() {
      const current = adhkar[index];
      const count = counts[current.text] || 0;
      const target = Number(current.target) || 0;

      dhikrText.textContent = current.text;
      dhikrNote.textContent = current.note || "";
      targetInput.value = target;
      currentCountEl.textContent = count;

      const total = Object.values(counts).reduce((sum, val) => sum + val, 0);
      totalCountEl.textContent = total;

      if (target <= 0) {
        progressFill.style.width = "100%";
        progressLabel.textContent = "عدّ مفتوح بلا حد";
      } else {
        const remainder = count % target;
        const displayCycle = (count > 0 && remainder === 0) ? target : remainder;
        const pct = Math.min(100, (displayCycle / target) * 100);
        progressFill.style.width = pct + "%";
        progressLabel.textContent = `${displayCycle} من ${target}`;
      }
    }

    function increment() {
      const current = adhkar[index];
      const newCount = (counts[current.text] || 0) + 1;
      counts[current.text] = newCount;
      const target = Number(current.target) || 0;

      if (target > 0 && newCount % target === 0) {
        playGoalSound();
        if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
        openCelebration(target);
      } else {
        playClickSound();
        if (navigator.vibrate) navigator.vibrate(15);
      }

      saveAll();
      updateUI();
    }

    let lastTouchEnd = 0;
    countBtn.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 350) {
        e.preventDefault();
      }
      lastTouchEnd = now;
      e.preventDefault();
      increment();
    }, { passive: false });

    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300 && !["INPUT", "SELECT"].includes(e.target.tagName)) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    countBtn.addEventListener("click", (e) => {
      if (e.detail === 0) {
        increment();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        increment();
      }
    });

    dhikrSelect.addEventListener("change", (e) => {
      index = Number(e.target.value);
      saveAll();
      updateUI();
    });

    targetInput.addEventListener("change", () => {
      const val = Math.max(0, Number(targetInput.value) || 0);
      adhkar[index].target = val;
      saveAll();
      renderSelect();
      updateUI();
    });

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % adhkar.length;
      saveAll();
      renderSelect();
      updateUI();
    });

    resetBtn.addEventListener("click", () => {
      const current = adhkar[index];
      counts[current.text] = 0;
      saveAll();
      updateUI();
    });

    themeBtn.addEventListener("click", () => {
      isDark = !isDark;
      saveAll();
      updateThemeAndMuteUI();
    });

    muteBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      saveAll();
      updateThemeAndMuteUI();
      if (!isMuted) playClickSound();
    });

    toggleAddBtn.addEventListener("click", () => {
      addPanel.classList.toggle("open");
    });

    saveDhikrBtn.addEventListener("click", () => {
      const text = newDhikrText.value.trim();
      const target = Math.max(0, Number(newDhikrTarget.value) || 0);
      if (!text) return;

      adhkar.push({ text, target, note: "ذكر مضاف" });
      index = adhkar.length - 1;
      newDhikrText.value = "";
      addPanel.classList.remove("open");
      saveAll();
      renderSelect();
      updateUI();
    });

    updateThemeAndMuteUI();
    renderSelect();
    updateUI();
  </script>
</body>
</html>
